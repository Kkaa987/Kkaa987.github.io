<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 400px;
    padding: 36px 30px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .card h1 {
    font-size: 26px;
    color: #1f2937;
    text-align: center;
    margin-bottom: 6px;
  }
  .card p.sub {
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .field {
    position: relative;
    margin-bottom: 20px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    padding: 13px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 15px;
    color: #111827;
    background: #f9fafb;
    transition: border-color .2s, background .2s, box-shadow .2s;
    outline: none;
  }
  .field input:focus {
    border-color: #667eea;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
  }
  .field input::placeholder { color: #9ca3af; }
  .toggle {
    position: absolute;
    right: 12px;
    bottom: 11px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    color: #667eea;
    font-weight: 600;
    padding: 4px;
  }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
    margin-top: 6px;
  }
  .btn:hover { box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: .6; cursor: default; }
  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  .msg.ok { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .msg.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
</style>
</head>
<body>

<div class="card">
  <h1>Создать аккаунт</h1>
  <p class="sub">Заполните поля, чтобы продолжить</p>

  <form id="regForm" action="https://formspree.io/f/moeeklqr" method="POST">
    <div class="field">
      <label for="name">Имя пользователя</label>
      <input type="text" id="name" name="name" placeholder="Например, Иван" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@mail.ru" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" placeholder="Минимум 6 символов" autocomplete="new-password" minlength="6" required>
      <button type="button" class="toggle" id="toggleBtn">Показать</button>
    </div>

    <!-- honeypot против спама -->
    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="_subject" value="Новая регистрация с сайта">

    <button type="submit" class="btn" id="submitBtn">Зарегистрироваться</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
  const form = document.getElementById('regForm');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  const pass = document.getElementById('password');
  const toggle = document.getElementById('toggleBtn');

  toggle.addEventListener('click', () => {
    const isPass = pass.type === 'password';
    pass.type = isPass ? 'text' : 'password';
    toggle.textContent = isPass ? 'Скрыть' : 'Показать';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Отправка...';
    msg.className = 'msg';

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if (res.ok) {
        msg.textContent = 'Готово! Данные отправлены.';
        msg.className = 'msg ok';
        form.reset();
      } else {
        const data = await res.json().catch(() => ({}));
        msg.textContent = (data.errors && data.errors[0] && data.errors[0].message) || 'Что-то пошло не так. Попробуйте ещё раз.';
        msg.className = 'msg err';
      }
    } catch (err) {
      msg.textContent = 'Ошибка сети. Проверьте интернет и попробуйте снова.';
      msg.className = 'msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Зарегистрироваться';
    }
  });
</script>

</body>
</html>
